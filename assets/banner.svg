<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">CofeLang</title>
  <desc id="d">CofeLang banner: Brew and Bytes for Students</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e2723"/>
      <stop offset="0.55" stop-color="#5d4037"/>
      <stop offset="1" stop-color="#8d6e63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ffcc80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffcc80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7ccc8"/>
      <stop offset="0.45" stop-color="#fff8f0"/>
      <stop offset="1" stop-color="#d7ccc8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcc80"/>
      <stop offset="1" stop-color="#ffb74d"/>
    </linearGradient>
    <symbol id="bean" viewBox="-30 -20 60 40">
      <ellipse rx="26" ry="16" fill="#ffcc80"/>
      <path d="M-24 2 Q-8 -8 4 2 T26 -2" fill="none" stroke="#5d4037" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <style>
      .steam { fill: none; stroke: #ffcc80; stroke-width: 6; stroke-linecap: round; opacity: .65; animation: rise 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.2s; }
      .s3 { animation-delay: 2.4s; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(14px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-14px); } }
      .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- decorative beans -->
  <g opacity="0.10">
    <use href="#bean" x="60" y="20" width="90" height="60" transform="rotate(-20 105 50)"/>
    <use href="#bean" x="520" y="240" width="80" height="54" transform="rotate(25 560 267)"/>
    <use href="#bean" x="640" y="30" width="70" height="46" transform="rotate(12 675 53)"/>
    <use href="#bean" x="1090" y="230" width="90" height="60" transform="rotate(-30 1135 260)"/>
  </g>

  <!-- text -->
  <text x="90" y="105" class="serif" font-size="20" fill="#ffcc80" letter-spacing="6">STUDENT-FRIENDLY CAFE</text>
  <text x="86" y="200" class="serif" font-size="96" font-weight="700" fill="#fff3e0">CofeLang</text>
  <rect x="90" y="222" width="120" height="5" rx="2.5" fill="url(#gold)"/>
  <text x="90" y="268" class="serif" font-size="28" font-style="italic" fill="#d7ccc8">Brew &amp; Bytes for Students</text>

  <!-- cup -->
  <g transform="translate(0 0)">
    <ellipse cx="930" cy="262" rx="135" ry="20" fill="#2a1a16" opacity="0.55"/>
    <ellipse cx="930" cy="252" rx="125" ry="17" fill="#d7ccc8"/>
    <path d="M1018 150 q58 0 58 42 q0 42 -58 42" fill="none" stroke="url(#cup)" stroke-width="16" stroke-linecap="round"/>
    <path d="M838 128 H1022 V192 Q1022 252 930 252 Q838 252 838 192 Z" fill="url(#cup)"/>
    <ellipse cx="930" cy="128" rx="92" ry="17" fill="#fff8f0"/>
    <ellipse cx="930" cy="131" rx="80" ry="12" fill="#4e342e"/>
    <ellipse cx="930" cy="129" rx="52" ry="6" fill="#6d4c41"/>
    <text x="930" y="212" class="mono" font-size="40" font-weight="700" text-anchor="middle" fill="#8d6e63">&lt;/&gt;</text>
    <path d="M846 168 Q930 184 1014 168" fill="none" stroke="#ffcc80" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- steam -->
  <path class="steam" d="M890 105 q-18 -22 0 -44 q18 -22 0 -44"/>
  <path class="steam s2" d="M930 100 q-18 -22 0 -44 q18 -22 0 -44"/>
  <path class="steam s3" d="M970 105 q-18 -22 0 -44 q18 -22 0 -44"/>

  <rect y="314" width="1200" height="6" fill="url(#gold)"/>
</svg>
